# Android Studio 同梱 JDK(JBR) が Gatekeeper に隔離されると posix_spawn の jspawnhelper 実行が
# 失敗し AAPT2 デーモンが起動できないため、jspawnhelper を経由しない vfork 方式で子プロセスを起動する。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.lang.Process.launchMechanism=vfork
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
